<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>🔧 API 테스트 도구</h1>
    
    <div class="test-section">
        <h3>1. 백엔드 헬스 체크</h3>
        <button onclick="testHealth()">헬스 체크</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. Router API 테스트</h3>
        <input type="text" id="query-input" placeholder="질문을 입력하세요 (예: 최수아 실적 분석)" value="최수아 직원의 실적을 분석해줘">
        <button onclick="testRouter()">Router API 테스트</button>
        <div id="router-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. 사용자 선택 API 테스트</h3>
        <select id="agent-select">
            <option value="employee_agent">직원 분석</option>
            <option value="client_agent">고객 분석</option>
            <option value="docs_agent">문서 분류</option>
            <option value="search_agent">내부 검색</option>
        </select>
        <button onclick="testSelectAgent()">선택 API 테스트</button>
        <div id="select-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>4. 프론트엔드 링크</h3>
        <a href="http://localhost:3000/chat" target="_blank">
            <button>💬 채팅 화면 열기</button>
        </a>
        <a href="http://localhost:3000" target="_blank">
            <button>🏠 메인 화면 열기</button>
        </a>
    </div>

    <script>
        const sessionId = 'test_session_' + Date.now();
        
        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '⏳ 테스트 중...';
            
            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <strong>✅ 헬스 체크 성공!</strong><br>
                    상태: ${data.status}<br>
                    메시지: ${data.message}<br>
                    버전: ${data.version}
                `;
            } catch (error) {
                resultDiv.innerHTML = `❌ 헬스 체크 실패: ${error.message}`;
            }
        }

        async function testRouter() {
            const resultDiv = document.getElementById('router-result');
            const query = document.getElementById('query-input').value;
            
            resultDiv.innerHTML = '⏳ Router API 테스트 중...';
            
            try {
                const response = await fetch('http://localhost:8000/api/router/router', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        query: query
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (data.needs_user_selection) {
                        resultDiv.innerHTML = `
                            <strong>🎯 사용자 선택 필요</strong><br>
                            메시지: ${data.message}<br>
                            사용 가능한 에이전트: ${Object.keys(data.available_agents || {}).join(', ')}<br>
                            <small>아래 "선택 API 테스트"를 사용하세요.</small>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <strong>✅ Router API 성공!</strong><br>
                            선택된 에이전트: ${data.agent}<br>
                            응답: ${data.response ? data.response.substring(0, 200) + '...' : 'N/A'}
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `❌ Router API 실패: ${data.message || data.error}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `❌ Router API 오류: ${error.message}`;
            }
        }

        async function testSelectAgent() {
            const resultDiv = document.getElementById('select-result');
            const query = document.getElementById('query-input').value;
            const selectedAgent = document.getElementById('agent-select').value;
            
            resultDiv.innerHTML = '⏳ 선택 API 테스트 중...';
            
            try {
                const response = await fetch('http://localhost:8000/api/router/select-agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        query: query,
                        selected_agent: selectedAgent
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <strong>✅ 선택 API 성공!</strong><br>
                        에이전트: ${data.agent}<br>
                        응답: ${data.response ? data.response.substring(0, 300) + '...' : 'N/A'}
                    `;
                } else {
                    resultDiv.innerHTML = `❌ 선택 API 실패: ${data.error || data.message}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `❌ 선택 API 오류: ${error.message}`;
            }
        }

        // 페이지 로드 시 자동으로 헬스 체크
        window.onload = function() {
            testHealth();
            document.getElementById('router-result').innerHTML = 'Router API를 테스트하려면 버튼을 클릭하세요.';
            document.getElementById('select-result').innerHTML = '선택 API를 테스트하려면 버튼을 클릭하세요.';
        };
    </script>
</body>
</html>
