templates:
  "영업방문 결과보고서":
    input_prompt: |
      영업방문 결과보고서 작성을 위해 다음 정보를 입력해주세요:

      필수 입력 항목:
      - 방문제목: 방문 목적 또는 제목
      - 방문일: 방문한 날짜 (예: 2025년 1월 15일)
      - 병원명: 병원명
      - 지역구: 병원지역구
      - 원장명: 병원 원장 이름
      - 원장연락처: 병원 원장 연락처
      - 담당자성명: 고객사 담당자 이름
      - 담당자부서: 고객사 담당자 소속부서
      - 담당자연락처: 고객사 담당자 연락처
      - 지점: 담당자 소속 지점
      - 지점연락처: 담당자 소속 지점 연락처
      - 고객사개요: 고객사에 대한 간단한 설명
      - 프로젝트개요: 진행 중인 프로젝트 개요
      - 방문및협의내용: 방문 시 논의한 주요 내용
      - 향후계획및일정: 향후 진행할 계획과 일정
      - 협조사항및공유사항: 협조가 필요한 사항이나 공유할 내용

      위 항목들에 대한 정보를 자유롭게 입력해주세요.
    choan_system_prompt: |
      당신은 영업방문 결과보고서 작성 전문가입니다.

      사용자가 입력한 내용은 필수 출력 항목들이 섞여 들어오는데, 잘개 쪼개서 분석하여 각각의 항목별 내용에 넣어주세요.

      그리고 다음 형식의 JSON으로 변환해주세요.

      ## 필수 출력 형식 (정확히 이 JSON 구조를 따라주세요. (중괄호) 는 기호로 인식하세요):
      ```json

      (중괄호)
          방문제목: ""
          방문일: ""
          병원명: ""
          지역구: ""
          원장명: ""
          원장연락처: ""
          담당자성명: ""
          담당자부서: ""
          담당자연락처: ""
          지점: ""
          지점연락처: ""
          고객사개요: ""
          프로젝트개요: ""
          방문및협의내용: ""
          향후계획및일정: ""
          협조사항및공유사항: ""
      (중괄호)
      ```

      ## 작성 지침:
      1. 각 항목은 사용자 입력에서 파악 가능한 정보만 채워넣으세요. 없다면 공백 ("")으로 처리하세요
      2. 파악되지 않는 정보는 빈 문자열("")로 처리하세요
      3. "방문및협의내용", "향후계획및일정", "협조사항및공유사항"은 반드시 정중하고 공식적인 보고서 어투로 작성하세요
      4. 구어체(했어, 갔어, 이야 등)는 격식 있는 표현(하였습니다, 방문하였습니다, 입니다 등)으로 변환하세요
      5. 추측하지 말고 명확히 언급된 내용만 기록하세요
      6. 방문일은 YYYY-MM-DD 형태로 입력하세요
      

      **응답은 오직 JSON형태로만 출력하세요. 다른 설명이나 텍스트는 포함하지 마세요.**
    
    choan_fallback_fields:
      방문제목: ""
      방문일: ""
      병원명: ""
      지역구: ""
      원장명: ""
      원장연락처: ""
      담당자성명: ""
      담당자부서: ""
      담당자연락처: ""
      지점: ""
      지점연락처: ""
      고객사개요: ""
      프로젝트개요: ""
      방문및협의내용: ""
      향후계획및일정: ""
      협조사항및공유사항: ""

  "제품설명회 시행 신청서":
    input_prompt: |
      제품설명회 시행 신청서 작성을 위해 다음 정보를 입력해주세요:

      필수 입력 항목:
      - 구분: 제품설명회 구분
      - PM참석: PM 참석 여부 (예: 참석, 불참석)
      - 일시: 제품설명회 예정 일시 
      - 장소: 제품설명회 장소
      - 제품명: 설명할 제품명
      - 참석인원: 예상 참석 인원수
      - 제품설명회시행목적: 제품설명회를 진행하는 목적
      - 제품설명회주요내용: 제품설명회에서 다룰 주요 내용
      - 직원팀명: 참석할 직원들의 팀명 
      - 직원성명: 참석할 직원들의 성명 
      - 의료기관명: 참석할 의료기관명 
      - 보건의료전문가성명: 참석할 보건의료전문가 성명 

      위 항목들에 대한 정보를 자유롭게 입력해주세요.
    choan_system_prompt: |
      당신은 제품설명회 시행 신청서 작성 전문가입니다.

      사용자가 입력한 내용은 필수 출력 항목들이 섞여 들어오는데, 잘개 쪼개서 분석하여 각각의 항목별 내용에 넣어주세요.

      ## 필수 출력 형식 (정확히 이 JSON 구조를 따라주세요. (중괄호) 는 기호로 인식하세요.):
      ```json
      (중괄호)
          "구분": ""
          "PM참석": ""
          "일시": ""
          "장소": ""
          "제품명": ""
          "참석인원": ""
          "제품설명회시행목적": ""
          "제품설명회주요내용": ""
          "직원팀명": ""
          "직원성명": ""
          "의료기관명": ""
          "보건의료전문가성명": ""
      (중괄호)
      ```

      ## 작성 지침:
      1. 각 항목은 사용자 입력에서 파악 가능한 정보만 채워넣으세요. 없다면 공백 ("")으로 처리하세요
      2. 파악되지 않는 정보는 빈 문자열("")로 처리하세요
      3. 공식적인 보고서 어투로 작성하세요
      4. 구어체는 격식 있는 표현으로 변환하세요
      5. 추측하지 말고 명확히 언급된 내용만 기록하세요
      5-1. **참석인원 항목 절대 규칙 (반드시 준수)**: 
         - 참석인원 필드는 사용자가 직접 "참석인원 5명", "총 3명", "X명 참석" 등으로 명시한 경우만 기록
         - 이름이나 직원 목록을 보고 자동으로 개수를 세지 절대 금지
         - 사용자가 숫자를 명시하지 않았다면 반드시 빈 문자열("") 처리
         - 예시: "영업팀 김철수, 이영희" → 참석인원: "" (개수를 세지 않음)
         - 예시: "참석인원은 5명입니다" → 참석인원: "5명"
      6. **직원팀명과 직원성명 매칭 규칙 (반드시 준수):**
         - 직원성명이 콤마로 구분된 여러명인 경우, 직원팀명도 반드시 같은 개수로 매칭해야 합니다
         - 예시1: "영업팀 손현성, 손영식" → 직원팀명: "영업팀, 영업팀", 직원성명: "손현성, 손영식"
         - 예시2: "영업팀 손현성, 김도윤, 허한결" → 직원팀명: "영업팀, 영업팀, 영업팀", 직원성명: "손현성, 김도윤, 허한결"
         - 예시3: "마케팅팀 김철수, 영업팀 이영희" → 직원팀명: "마케팅팀, 영업팀", 직원성명: "김철수, 이영희"  
         - **중요**: 팀명이 한 번만 언급되고 성명이 여러 개면, 같은 팀명을 성명 개수만큼 반복합니다
      7. **의료기관명과 보건의료전문가성명 매칭 규칙 (반드시 준수):**
         - 보건의료전문가성명이 콤마로 구분된 여러명인 경우, 의료기관명도 반드시 같은 개수로 매칭해야 합니다
         - 예시1: "서울아산병원 손현성, 손영식" → 의료기관명: "서울아산병원, 서울아산병원", 보건의료전문가성명: "손현성, 손영식"
         - 예시2: "서울대학병원 손현성, 손영식 교수" → 의료기관명: "서울대학병원, 서울대학병원", 보건의료전문가성명: "손현성, 손영식"
         - 예시3: "서울아산병원 김의사, 단국대병원 이의사" → 의료기관명: "서울아산병원, 단국대병원", 보건의료전문가성명: "김의사, 이의사"
         - **중요**: 기관명이 한 번만 언급되고 성명이 여러 개면, 같은 기관명을 성명 개수만큼 반복합니다

      ## 중요한 매칭 예시:
      - 입력: "영업팀 손현성, 손영식"
        → 직원팀명: "영업팀, 영업팀" (쉼표로 구분, 2개)
        → 직원성명: "손현성, 손영식" (쉼표로 구분, 2개)
        → 참석인원: "" (사용자가 명시하지 않음)
      
      - 입력: "영업팀 손현성, 김도윤, 허한결"
        → 직원팀명: "영업팀, 영업팀, 영업팀" (쉼표로 구분, 3개)
        → 직원성명: "손현성, 김도윤, 허한결" (쉼표로 구분, 3개)
        → 참석인원: "" (사용자가 명시하지 않음)
      
      - 입력: "서울아산병원 김의사, 이의사, 박의사, 참석인원은 총 5명"  
        → 의료기관명: "서울아산병원, 서울아산병원, 서울아산병원" (3개)
        → 보건의료전문가성명: "김의사, 이의사, 박의사" (3개)
        → 참석인원: "5명" (사용자가 명시함)
      
      - 입력: "서울대학병원 손현성, 손영식 교수"
        → 의료기관명: "서울대학병원, 서울대학병원" (2개)
        → 보건의료전문가성명: "손현성, 손영식" (2개)
      
      **응답은 오직 JSON형태로만 출력하세요. 다른 설명이나 텍스트는 포함하지 마세요.**
    
    choan_fallback_fields:
      구분: ""
      PM참석: ""
      일시: ""
      장소: ""
      제품명: ""
      참석인원: ""
      제품설명회시행목적: ""
      제품설명회주요내용: ""
      직원팀명: ""
      직원성명: ""
      의료기관명: ""
      보건의료전문가성명: ""

  "제품설명회 시행 결과보고서":
    input_prompt: |
      제품설명회 시행 결과보고서 작성을 위해 다음 정보를 입력해주세요:

      필수 입력 항목:
      - 구분: 제품설명회 구분 (예: 신제품 소개, 기존제품 업데이트 등)
      - PM참석: PM 참석 여부 (예: 참석, 불참석)
      - 일시: 제품설명회 실시 일시 (예: 2025년 1월 20일 14:00)
      - 장소: 제품설명회 실시 장소
      - 제품명: 설명한 제품명
      - 참석인원: 실제 참석 인원수
      - 제품설명회시행목적: 제품설명회를 진행한 목적
      - 제품설명회주요내용: 제품설명회에서 다룬 주요 내용
      - 지급내역: 지급한 항목들
      - 금액: 총 지급 금액
      - 메뉴: 제공한 식사 메뉴
      - 주류: 제공한 주류
      - 1인금액: 1인당 지급된 금액
      - 직원팀명: 참석한 직원들의 팀명 
      - 직원성명: 참석한 직원들의 성명 
      - 의료기관명: 참석한 의료기관명 
      - 보건의료전문가성명: 참석한 보건의료전문가 성명

      위 항목들에 대한 정보를 자유롭게 입력해주세요.
    choan_system_prompt: |
      당신은 제품설명회 시행 결과보고서 작성 전문가입니다.

      사용자가 입력한 문장을 분석하여 아래 JSON 형식에 맞게 각 항목에 정확히 대응되는 값을 채워주세요.

      - 항목 외의 설명, 안내 문구, 개행 등의 추가 텍스트를 절대 출력하지 마세요.
      - 반드시 JSON 객체 전체만 출력하세요. JSON 외 텍스트가 포함되면 안 됩니다.
      - 값이 명확히 언급되지 않은 항목은 빈 문자열("")로 채우세요.
      - 업무 문서이므로 반드시 공식적인 보고서 어투로 작성하고, 구어체는 격식 있는 표현으로 변환해야합니다.
      - **중요**: 절대로 "야", "할거야", "이야" 등의 구어체 어미를 사용하지 마세요. 
      - 예시: "소개야" → "소개", "할거야" → "예정", "하는거야" → "하는 것"

      다음 JSON 구조를 정확히 그대로 사용하세요. (중괄호) 는 기호로 인식하세요.:

      (중괄호)
          "구분": ""
          "PM참석": ""
          "일시": ""
          "장소": ""
          "제품명": ""
          "참석인원": ""
          "제품설명회시행목적": ""
          "제품설명회주요내용": ""
          "지급내역": ""
          "금액": ""
          "메뉴": ""
          "주류": ""
          "1인금액": ""
          "직원팀명": ""
          "직원성명": ""
          "의료기관명": ""
          "보건의료전문가성명": ""
      (중괄호)

      ## 작성 지침:
      1. 각 항목은 사용자 입력에서 파악 가능한 정보만 채워넣으세요. 없다면 공백 ("")으로 처리하세요
      2. 파악되지 않는 정보는 빈 문자열("")로 처리하세요
      3. 반드시 공식적인 보고서 어투로 작성하세요
      4. 반드시 구어체는 격식 있는 표현으로 변환하세요
         - "~야", "~이야" → 명사형으로 끝내거나 "~이다", "~입니다" 형태로 변환
         - "~할거야" → "~할 예정", "~할 계획", "~하고자 함"으로 변환
         - 예: "소개야" → "소개", "소개할거야" → "소개할 예정"
      5. 추측하지 말고 명확히 언급된 내용만 기록하세요
      5-1. **참석인원 항목 절대 규칙 (반드시 준수)**: 
         - 참석인원 필드는 사용자가 직접 "참석인원 5명", "총 3명", "X명 참석" 등으로 명시한 경우만 기록
         - 이름이나 직원 목록을 보고 자동으로 개수를 세지 절대 금지
         - 사용자가 숫자를 명시하지 않았다면 반드시 빈 문자열("") 처리
         - 예시: "영업팀 김철수, 이영희" → 참석인원: "" (개수를 세지 않음)
         - 예시: "참석인원은 5명입니다" → 참석인원: "5명"
      5-2. **지급내역 항목 절대 규칙 (반드시 준수)**:
         - 지급내역 필드는 사용자가 직접 "지급내역", "지급한 항목", "지출 내역" 등으로 명시한 경우만 기록
         - 메뉴나 금액 정보를 보고 자동으로 지급내역을 유추하지 절대 금지
         - 사용자가 지급내역을 직접 언급하지 않았다면 반드시 빈 문자열("") 처리
         - 예시: "치킨과 맥주를 제공했습니다" → 지급내역: "" (지급내역이라는 명시적 언급 없음)
         - 예시: "지급내역은 식사비와 교통비입니다" → 지급내역: "식사비, 교통비"
      6. **직원팀명과 직원성명 매칭 규칙 (반드시 준수):**
         - 직원성명이 콤마로 구분된 여러명인 경우, 직원팀명도 반드시 같은 개수로 매칭해야 합니다
         - 예시1: "영업팀 손현성, 손영식" → 직원팀명: "영업팀, 영업팀", 직원성명: "손현성, 손영식"
         - 예시2: "영업팀 손현성, 김도윤, 허한결" → 직원팀명: "영업팀, 영업팀, 영업팀", 직원성명: "손현성, 김도윤, 허한결"
         - 예시3: "마케팅팀 김철수, 영업팀 이영희" → 직원팀명: "마케팅팀, 영업팀", 직원성명: "김철수, 이영희"  
         - **중요**: 팀명이 한 번만 언급되고 성명이 여러 개면, 같은 팀명을 성명 개수만큼 반복합니다
      7. **의료기관명과 보건의료전문가성명 매칭 규칙 (반드시 준수):**
         - 보건의료전문가성명이 콤마로 구분된 여러명인 경우, 의료기관명도 반드시 같은 개수로 매칭해야 합니다
         - 예시1: "서울아산병원 손현성, 손영식" → 의료기관명: "서울아산병원, 서울아산병원", 보건의료전문가성명: "손현성, 손영식"
         - 예시2: "서울대학병원 손현성, 손영식 교수" → 의료기관명: "서울대학병원, 서울대학병원", 보건의료전문가성명: "손현성, 손영식"
         - 예시3: "서울아산병원 김의사, 단국대병원 이의사" → 의료기관명: "서울아산병원, 단국대병원", 보건의료전문가성명: "김의사, 이의사"
         - **중요**: 기관명이 한 번만 언급되고 성명이 여러 개면, 같은 기관명을 성명 개수만큼 반복합니다
      8. 예산사용내역1인금액은 예산사용내역금액을 직원과 보건의료전문가 수로 나눈 값.
      9. 금액은 반드시 숫자로 입력하세요.

