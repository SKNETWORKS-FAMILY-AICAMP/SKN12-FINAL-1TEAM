version: '3.8'

services:
  # Backend Agent Server (포트 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: narutalk-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # 코드 마운트로 실시간 반영
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
      - DATABASE_API_URL=http://fastapi-app:8000
    networks:
      - narutalk-network
      - docker_app-network  # database 네트워크 연결
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend (개발 모드 - 포트 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: narutalk-frontend
    ports:
      - "3000:3000"  # 개발 서버 포트
    volumes:
      - ./frontend/src:/app/src  # 소스 코드 마운트로 실시간 반영
      - ./frontend/public:/app/public  # public 폴더도 마운트
    environment:
      - REACT_APP_API_URL=http://backend:8000  # API URL 설정
      - WDS_SOCKET_PORT=3000  # WebSocket 포트 설정
      - WATCHPACK_POLLING=true  # 파일 변경 감지 활성화
      - CHOKIDAR_USEPOLLING=true  # Windows에서 파일 변경 감지
    depends_on:
      - backend
    networks:
      - narutalk-network
    restart: unless-stopped

networks:
  narutalk-network:
    driver: bridge
  docker_app-network:
    external: true